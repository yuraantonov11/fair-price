name: Collect Confirmed Prices

on:
  schedule:
    - cron: '17 3 * * *'  # щодня о 03:17 UTC, поза піком на початку години
  workflow_dispatch:        # ручний запуск через GitHub UI
    inputs:
      store:
        description: 'Store to crawl (all = both stores; Rozetka uses known URLs)'
        required: false
        type: choice
        options: [all, dnipro-m.ua, rozetka.com.ua]
        default: all
      limit:
        description: 'Optional URL limit for test runs (empty = all)'
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: confirmed-prices-node
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing GitHub secret: SUPABASE_SERVICE_ROLE_KEY"
            echo "Add it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Run crawler script
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWL_LIMIT: ${{ inputs.limit }}
          CRAWL_STORE: ${{ inputs.store }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Missing GitHub variable SUPABASE_URL"; exit 1; fi
          npm run doctor:crawl
          node scripts/crawl.mjs
