name: Deploy Crawler

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/crawl-prices/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-crawler.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy crawl-prices function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Configure crawler authentication
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CRAWL_TRIGGER_SECRET: ${{ secrets.CRAWL_TRIGGER_SECRET }}
        run: |
          if [ -z "$CRAWL_TRIGGER_SECRET" ]; then echo "Missing CRAWL_TRIGGER_SECRET"; exit 1; fi
          supabase secrets set CRAWL_TRIGGER_SECRET="$CRAWL_TRIGGER_SECRET"

      - name: Deploy function
        run: supabase functions deploy crawl-prices --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify deployment
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRAWL_TRIGGER_SECRET: ${{ secrets.CRAWL_TRIGGER_SECRET }}
        run: node scripts/check-edge.mjs
