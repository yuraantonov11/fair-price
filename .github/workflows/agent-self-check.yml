name: Agent Self Check

on:
  workflow_dispatch:
    inputs:
      backend_action:
        description: 'Existing project maintenance (never creates or replaces a project)'
        required: false
        type: choice
        options: [none, inspect, restore, migration-plan, migrate]
        default: none
      run_crawler_smoke:
        description: 'Run crawler smoke test (writes a small sample to Supabase)'
        required: false
        type: boolean
        default: false
      crawl_limit:
        description: 'Crawler smoke URL limit'
        required: false
        type: string
        default: '5'

jobs:
  backend-maintenance:
    if: ${{ inputs.backend_action != 'none' && inputs.backend_action != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Inspect or resume approved Supabase project
        run: node scripts/backend-maintenance.mjs
        env:
          BACKEND_ACTION: ${{ inputs.backend_action }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Setup Supabase CLI for migrations
        if: ${{ inputs.backend_action == 'migration-plan' || inputs.backend_action == 'migrate' }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Link existing project and show pending migrations
        if: ${{ inputs.backend_action == 'migration-plan' || inputs.backend_action == 'migrate' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --dry-run
      - name: Apply pending migrations
        if: ${{ inputs.backend_action == 'migrate' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

  extension-self-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Agent verify (doctor + checks + build)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
        run: npm run doctor:offline && npm run verify

  crawler-smoke:
    if: ${{ inputs.run_crawler_smoke == true }}
    needs: extension-self-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate crawler secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing GitHub secret: SUPABASE_SERVICE_ROLE_KEY"
            echo "Set it in Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Crawler preflight
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run doctor:crawl

      - name: Run crawler smoke
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWL_LIMIT: ${{ inputs.crawl_limit }}
        run: node scripts/crawl.mjs

